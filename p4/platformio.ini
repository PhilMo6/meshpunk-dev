; Meshpunk P4 — PlatformIO wrapper over the native ESP-IDF tree, so builds
; and uploads run from the VS Code toolbar like the S3 envs. The same tree
; still builds with bare idf.py (root CMakeLists.txt); PlatformIO enters
; through src_dir = main instead and honors sdkconfig.defaults + the custom
; partition CSV it names.
;
; Platform: pioarduino (the community continuation of espressif32) pinned to
; its 55.03.312 release = ESP-IDF v5.5.5 — the LilyGo T-Display-P4 repo
; requires v5.5.4+. The official platformio/espressif32 platform has no
; usable P4 support; the S3 envs in the repo root stay on espressif32@6.11.0
; untouched.
;
; Platform pin: 55.03.312 — the release built for PlatformIO Core 6.2.0.
; Core 6.2.0 (2026-09-05) moved SCons to 4.11.1; older platform releases
; pin tool-scons 4.8.1 and their espidf builds DELETE the running SCons
; package mid-build ("No module named 'SCons.Tool.FortranCommon'" — that is
; pioarduino issue #529, closed 2026-09-19; .312 ships the fixed pin the
; next day). 55.03.311 and older therefore cannot work under Core 6.2.0
; without hand-patching their platform.json.
;
; board: esp32-p4 (pre-rev300). THIS unit's silicon is ECO2 — the ROM
; banner prints "esp32p4-eco2-20240710" — and an image built with the
; esp32-p4_r3 (rev.300) definition faults with an illegal instruction at
; the bootloader entry (PC = the entry address) and watchdog-loops. The
; def's "flash_size": "4MB" is NOT cosmetic: the builder feeds it to
; gen_esp32part.py (--flash-size) and to esptool, ignoring sdkconfig's
; 16MB — a partition CSV larger than 4MB fails the build. Overridden by
; board_upload.flash_size below.

[platformio]
src_dir = main
default_envs = meshpunk_p4
; The same data/ tree the S3 envs upload (D7 of the port plan): `pio run -t
; uploadfs` builds a LittleFS image of it with littlefs-python (this
; platform's builder/main.py, build_littlefs_image: 4096-byte blocks, disk
; version 2.1 unless board_build.littlefs_version says otherwise) and writes
; it to the last filesystem partition of partitions_meshpunk_p4.csv, which
; is "assets". The firmware mounts that partition by label, as on the S3.
data_dir = ../data

[env:meshpunk_p4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
framework = espidf
board = esp32-p4
; ESP-IDF 5.5.6 in place of the 5.5.5 this platform release pins: 5.5.6
; carries esp-idf 9fd7cb7e606 ("fix(nimble): Fix ECC HW byte-order and
; dropped SOC_ESP_NIMBLE_CONTROLLER"), without which every LE Secure
; Connections pairing on the P4 fails at the DHKey check (TinyCrypt handed
; the ECC accelerator a 257-bit scalar in the wrong byte order). Same
; package form the platform uses, from pioarduino's esp-idf releases.
platform_packages =
    framework-espidf @ https://github.com/pioarduino/esp-idf/releases/download/v5.5.6/esp-idf-v5.5.6.tar.xz
; Toolchain note: this platform's tl-install manages
; toolchain-riscv32-esp itself (file:// spec from .platformio\tools) and
; its resolver breaks under a platform_packages override for that name
; ("Missing toolchain directory 'None'") — do not pin it here. The S3
; envs in the repo root pin THEIR toolchain-riscv32-esp to the same
; file:// spec instead, so project switches stop evicting this
; platform's 14.2.0 from the canonical package directory. tl-install's
; copy lands NESTED (no bin/ at the package root) whenever it
; reinstalls; the fix is moving the inner tree up one level.
monitor_speed = 115200
; LittleFS image for the data/ tree (the builder's default is also
; littlefs; written out so the choice is visible next to data_dir above).
board_build.filesystem = littlefs
; Per-board shipping filter (../data_filter.py, shared with the S3 envs):
; for the buildfs/uploadfs targets it stages the files this board carries
; into .pio/build/<env>/data_filtered and builds the image from there — the
; Xtensa boards' module artifacts (*.app.elf, *.loraproto.elf, ...) stay
; out of the P4's image, as the P4's *.rv32.elf files stay out of theirs.
extra_scripts =
    pre:../data_filter.py
; PIO's espidf builder takes the partition table from THIS setting and
; ignores sdkconfig's CUSTOM_FILENAME (observed: the rung-1 boot ran on
; IDF's default table despite the sdkconfig entry). idf.py uses the
; sdkconfig path; both name the same file.
board_build.partitions = partitions_meshpunk_p4.csv
; The generic esp32-p4 board json declares 4MB flash; this module is 16MB.
; The espidf builder honors this override (espidf.py reads
; board_upload.flash_size) for the partition-size check, the sdkconfig
; CONFIG_ESPTOOLPY_FLASHSIZE flags, and the esptool write arguments.
board_upload.flash_size = 16MB
; Monitor DTR/RTS: use PlatformIO's defaults (both asserted). The board's
; USB-C data port is a CH343 USB-UART bridge on UART0 (Windows enumerates
; "USB-Enhanced-SERIAL CH343", VID 1A86 / PID 55D3, COM4 on the PC; no
; USB-Serial-JTAG device has ever enumerated from this board) with the
; usual auto-reset wiring, so the pair cancels out to "run normally".
; Overriding them is what LilyGo's RTS warning is about, and it bites both
; ways: DTR=1/RTS=0 straps the chip into DOWNLOAD mode on every reset
; (observed: boot:0x307 "waiting for download"), DTR=0/RTS=1 holds it in
; reset.
