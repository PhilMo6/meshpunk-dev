dependencies:
  idf: ">=5.5"
  # LR2021 driver (rung 6): the class MeshCore's CustomLR2021 wrapper
  # builds on. LR2021 support exists since 7.6.0; 7.7.1 = registry latest.
  jgromes/radiolib: "^7.7.1"
  # SDIO slave link layer (rung 7): the host side of Espressif's SDIO
  # slave protocol — carries both ESP-AT and esp-hosted slave traffic.
  espressif/esp_serial_slave_link: "^1.1.2"
  # Espressif's host-side flasher (rung 7c): SDIO protocol to the C6 ROM +
  # its RAM stub. Its stock SDIO port is off by Kconfig default;
  # rung7c_c6_rom.c supplies the board port.
  espressif/esp-serial-flasher: "^2.0.0"
