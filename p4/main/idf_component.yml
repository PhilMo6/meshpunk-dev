dependencies:
  idf: ">=5.5"
  # The Arduino core as an IDF component (docs/P4_PORT_PLAN_2026-10-12.md
  # §2): the exact version pioarduino 55.03.312 ships. Its own manifest
  # pulls the Arduino dependency set for the P4 (mdns, esp_modem, esp-dsp,
  # network_provisioning, esp-sr, esp_hosted ^2.12.13, esp_wifi_remote
  # ^1.2.2, libsodium, esp-modbus, joltwallet/littlefs, esp-libhelix-mp3,
  # lan867x).
  espressif/arduino-esp32: "3.3.12"
  # RadioLib is NOT a registry dependency here: the firmware builds
  # lib/RadioLib through p4/components/radiolib (the copy every board
  # builds), and two copies of RadioLib.h cannot share one build. Rung 6's
  # LR2021 driver came from the registry 7.7.x; D8 of the port plan decides
  # the LR2021-capable version in Phase 3.
  # SDIO slave link layer (rung 7): the host side of Espressif's SDIO
  # slave protocol — carries both ESP-AT and esp-hosted slave traffic.
  espressif/esp_serial_slave_link: "^1.1.2"
  # NOT here any more: espressif/esp-serial-flasher ("^2.0.0"), Espressif's
  # host-side flasher that rung 7c used to write the C6 over SDIO (its stock
  # SDIO port is off by Kconfig default; rung7c_c6_rom.c supplies the board
  # port). Nothing in the firmware build uses it yet, and its registry
  # archive (a test/ tree of ~2700 files with build directories and very
  # long paths) was fetched incomplete twice on this PC (the second time the
  # component manager stopped the build with "corrupted"). It returns with
  # the C6-reflash feature the port carries forward (plan §1), together with
  # the usb_host_* components it pulls in.
  # esp-hosted host side (rung 8): upstream 2.12.13 vendored with the
  # MESHPUNK reset-callback patch (libraries/esp_hosted/MESHPUNK.md). The
  # override also serves Arduino's and esp_wifi_remote's esp_hosted
  # dependency.
  espressif/esp_hosted:
    override_path: "../libraries/esp_hosted"
  # esp_wifi_* calls carried to the C6 as esp-hosted RPCs (rung 8); 1.6.5
  # satisfies Arduino's ^1.2.2.
  espressif/esp_wifi_remote: "1.6.5"
  # The P4 capability backlog (docs/P4_PORT_PLAN_2026-10-12.md §6, D5: every
  # dependency in the build from Phase 0). Registry versions as checked
  # 2026-10-12; nothing in the firmware calls them yet.
  # Camera: OV2710 on MIPI-CSI (stills, video, QR scanning).
  espressif/esp_video: "2.5.0"
  espressif/esp_cam_sensor: "2.6.0"
  espressif/esp_ipa: "2.4.0"
  # H.264 encoding (the P4's hardware encoder).
  espressif/esp_h264: "1.4.1"
  # On-device AI on the P4 vector extensions.
  espressif/esp-dl: "3.3.13"
  # USB host (drive mode, keyboards, gamepads) and device (TinyUSB) once the
  # board's USB data path is confirmed (plan §9).
  espressif/usb_host_msc: "1.3.0"
  espressif/usb_host_hid: "1.2.1"
  espressif/esp_tinyusb: "2.4.0"
